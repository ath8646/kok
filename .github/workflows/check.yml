name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 비밀 키 검사
        run: npm run check:secrets
      - name: 단위 시험
        run: npm test
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
